llm:
  # Prefix controls the provider:
  #   gemini-*  → Google Gemini     (requires GOOGLE_API_KEY)
  #   claude-*  → Anthropic         (requires ANTHROPIC_API_KEY)
  #   local-*   → vLLM / HPC server (requires OPENAI_BASE_URL + OPENAI_API_KEY)
  model: local-deepseek-r1-distill-qwen-32b
  # model: gemini-2.5-flash
  max_tokens: 4096

corpus:
  raw_output: data/raw/papers.jsonl
  manifest_output: docs/corpus_manifest.csv

chunking:
  input_path: data/raw/papers.jsonl
  output_path: datav2/processed/chunks.jsonl
  chunk_size: 200
  overlap: 40

retrieval:
  chunks_input: datav2/processed/chunks.jsonl
  papers_input: datav2/raw/papers.jsonl
  embeddings_output: embeddingsv2/chunks.npy
  index_output: indexv2/faiss.index
  chunk_ids_output: indexv2/chunk_ids.txt
  meta_output: indexv2/index.meta.json
  traces_output: logs/retrieval_traces.jsonl
  model_name: sentence-transformers/all-MiniLM-L6-v2
  top_k: 20

reranker:
  enabled: true
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k: 10
  min_score: 0.0


summarizer:
  prompt_path: prompts/summarizer.txt
  traces_output: logs/summarizer_traces.jsonl
  output_path: outputs/paper_summaries.json

synthesizer:
  prompt_path: prompts/synthesizer.txt
  traces_output: logs/synthesizer_traces.jsonl
  output_path: outputs/synthesis_result.json

verifier:
  prompt_path: prompts/verifier.txt
  traces_output: logs/verifier_traces.jsonl
  verification_output: outputs/verification.jsonl
  answers_output: outputs/answers.jsonl
  min_citation_coverage: 0.60
  min_support_rate: 0.40

eval:
  queries_path: eval/queries.jsonl
  labels_path: eval/labels.jsonl
  results_output: reports/eval_results.json
  top_k_recall: 20
  max_queries: null
  ragas_model: gemini-2.5-flash


sources:
  pmc:
    enabled: true
    from_date: "2025-01-01"
    until_date: "2025-12-31"
    max_papers: 3000
    require_pdf: false
    skip_empty_abstract: true

  openalex:
    enabled: true
    queries:
      - "sustainability"
      - "healthcare"
      - "renewable energy"
      - "climate change"
      - "public health"
      - "environmental science"
    from_year: 2023
    max_papers: 3000
    is_oa: true
    has_abstract: true