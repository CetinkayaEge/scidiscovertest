llm:
  # Prefix controls the provider:
  #   gemini-*  → Google Gemini     (requires GOOGLE_API_KEY)
  #   claude-*  → Anthropic         (requires ANTHROPIC_API_KEY)
  #   local-*   → vLLM / HPC server (requires OPENAI_BASE_URL + OPENAI_API_KEY)
  model: local-qwen2.5-72b-instruct-gptq
  # model: gemini-2.5-flash
  max_tokens: 4096

corpus:
  raw_output: data/raw/papers.jsonl
  manifest_output: docs/corpus_manifest.csv

chunking:
  input_path: data/raw/papers.jsonl
  output_path: data/processed/chunks.jsonl
  chunk_size: 200
  overlap: 40

retrieval:
  chunks_input: data/processed/chunks.jsonl
  papers_input: data/raw/papers.jsonl
  embeddings_output: embeddings/chunks.npy
  index_output: index/faiss.index
  chunk_ids_output: index/chunk_ids.txt
  meta_output: index/index.meta.json
  traces_output: logs/retrieval_traces.jsonl
  model_name: sentence-transformers/all-MiniLM-L6-v2
  top_k: 20

reranker:
  enabled: true
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k: 10
  min_score: -.inf


summarizer:
  prompt_path: prompts/summarizer.txt
  traces_output: logs/summarizer_traces.jsonl
  output_path: outputs/paper_summaries.json
  # max_workers: 5   → local vLLM (HPC): safe up to 8-16
  #               3   → Gemini API: keeps calls under 10 RPM
  #               1   → sequential (disable parallelism)
  max_workers: 5

synthesizer:
  prompt_path: prompts/synthesizer.txt
  traces_output: logs/synthesizer_traces.jsonl
  output_path: outputs/synthesis_result.json

verifier:
  prompt_path: prompts/verifier.txt
  traces_output: logs/verifier_traces.jsonl
  verification_output: outputs/verification.jsonl
  answers_output: outputs/answers.jsonl
  min_citation_coverage: 0.60
  min_support_rate: 0.40

eval:
  queries_path: eval/queries.jsonl
  labels_path: eval/labels.jsonl
  results_output: reports/eval_results.json
  top_k_recall: 10
  max_queries: null
  ragas_model: gemini-2.5-flash # OpenRouter: openai/gpt-5.4-mini, openai/gpt-4o-mini, etc.
                                 # Gemini:     gemini-2.5-flash


sources:
  pmc:
    enabled: true
    from_date: "2023-01-01"
    until_date: "2025-12-31"
    max_papers: 8000
    require_pdf: false
    skip_empty_abstract: true

  openalex:
    enabled: true
    queries:
      - "sustainability"
      - "healthcare"
      - "renewable energy"
      - "climate change"
      - "public health"
      - "environmental science"
      - "circular economy"
      - "carbon emissions"
      - "sustainable agriculture"
      - "biodiversity conservation"
      - "mental health"
      - "infectious disease"
      - "chronic disease"
      - "digital health"
      - "global health equity"
      - "cancer research"
    from_year: 2020
    max_papers: 15000
    is_oa: true
    has_abstract: true